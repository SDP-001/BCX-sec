spring:
  datasource:
    url: ${DEMO_DB_URL:jdbc:h2:file:./target/bytecodx-demo;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DEMO_DB_USERNAME:sa}
    password: ${DEMO_DB_PASSWORD:}
  flyway:
    enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:5002}

bytecodx:
  demo-account:
    enabled: ${DEMO_ACCOUNT_ENABLED:true}
    email: ${DEMO_ACCOUNT_EMAIL:demo@bytecodx.local}
    password: ${DEMO_ACCOUNT_PASSWORD:BytecodxDemo2026!}
